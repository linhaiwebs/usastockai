version: '3.8'

services:
  # 前端服务 - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL_INTERNAL=http://backend:8000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_DEFAULT_LOCALE=${DEFAULT_LOCALE:-en}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockai-network
    restart: unless-stopped

  # 后端服务 - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://stockai:stockai123@db:5432/stockai
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - SILICONFLOW_BASE_URL=https://api.siliconflow.cn/v1
      - FINANCE_QUERY_URL=http://finance-query:8000
    depends_on:
      db:
        condition: service_healthy
      finance-query:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stockai-network
    restart: unless-stopped

  # 数据库服务 - PostgreSQL
  db:
    image: postgres:15-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: stockai
      POSTGRES_PASSWORD: stockai123
      POSTGRES_DB: stockai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockai-network
    restart: unless-stopped

  # Finance Query Server - 股票数据API服务
  finance-query:
    image: ghcr.io/verdenroz/finance-query:latest
    container_name: finance-query-server
    ports:
      - "${FINANCE_QUERY_PORT:-8002}:8000"
    environment:
      - RUST_LOG=info
      - RATE_LIMIT_PER_MINUTE=120
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stockai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: stockai-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - stockai-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  stockai-network:
    driver: bridge
