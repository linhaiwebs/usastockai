version: '3.8'

services:
  # 前端服务 - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # 服务器端使用的内部网络地址（Docker内部通信）
      - NEXT_PUBLIC_API_URL_INTERNAL=http://backend:8000
      # 客户端使用的外部地址（浏览器访问）
      # 如果使用自定义端口映射，请修改此配置
      # 例如：前端在 59877 端口，后端在 51915 端口
      # 则设置为：NEXT_PUBLIC_API_URL=http://localhost:51915
      # 或使用实际的服务器IP/域名
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockai-network
    restart: unless-stopped

  # 后端服务 - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://stockai:stockai123@db:5432/stockai
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - SILICONFLOW_BASE_URL=https://api.siliconflow.cn/v1
      # Finance Query 本地部署地址
      - FINANCE_QUERY_URL=http://finance-query:8000
    depends_on:
      db:
        condition: service_healthy
      finance-query:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stockai-network
    restart: unless-stopped

  # 数据库服务 - PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: stockai
      POSTGRES_PASSWORD: stockai123
      POSTGRES_DB: stockai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockai-network
    restart: unless-stopped

  # Finance Query Server - 股票数据API服务
  finance-query:
    image: ghcr.io/verdenroz/finance-query:latest
    container_name: finance-query-server
    ports:
      - "8002:8000"
    environment:
      - RUST_LOG=info
      - RATE_LIMIT_PER_MINUTE=120
      # - REDIS_URL=redis://redis:6379  # 可选：启用Redis缓存
    restart: unless-stopped
    networks:
      - stockai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  stockai-network:
    driver: bridge
