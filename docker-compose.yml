version: '3.8'

services:
  # 前端服务 - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL_INTERNAL=http://backend:${BACKEND_PORT:-8000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}}
      - NEXT_PUBLIC_DEFAULT_LOCALE=${DEFAULT_LOCALE:-en}
      - NEXT_PUBLIC_DEFAULT_API_PORT=${BACKEND_PORT:-8000}
      - NEXT_PUBLIC_DEFAULT_FRONTEND_PORT=${FRONTEND_PORT:-3000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockai-network
    restart: unless-stopped

  # 后端服务 - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=${BACKEND_PORT:-8000}
      # Database Configuration
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-stockai}
      - DB_PASSWORD=${DB_PASSWORD:-stockai123}
      - DB_NAME=${DB_NAME:-stockai}
      # SiliconFlow AI
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      - SILICONFLOW_MODEL=${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-R1-0528-Qwen3-8B}
      # Finance Query API (使用托管服务或本地部署)
      - FINANCE_QUERY_HOST=${FINANCE_QUERY_HOST:-https://finance-query.com}
      - FINANCE_QUERY_PORT=${FINANCE_QUERY_PORT:-443}
      - FINANCE_QUERY_USE_HTTPS=${FINANCE_QUERY_USE_HTTPS:-true}
      # App Configuration
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stockai-network
    restart: unless-stopped

  # 数据库服务 - PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-stockai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockai123}
      POSTGRES_DB: ${DB_NAME:-stockai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockai-network
    restart: unless-stopped

  # Redis 缓存服务（可选，用于后端缓存）
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - stockai-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  stockai-network:
    driver: bridge
