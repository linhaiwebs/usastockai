# Finance Query 自部署服务
version: '3.8'

services:
  # Finance Query Server - 股票数据API服务
  finance-query:
    image: ghcr.io/verdenroz/finance-query:latest
    container_name: finance-query-server
    ports:
      - "8002:8000"
    environment:
      - RUST_LOG=info
      - RATE_LIMIT_PER_MINUTE=120
      # - REDIS_URL=redis://redis:6379  # 可选：启用Redis缓存
    restart: unless-stopped
    networks:
      - stockai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis缓存（可选，提升性能）
  # redis:
  #   image: redis:7-alpine
  #   container_name: finance-query-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
  #   networks:
  #     - stockai-network

networks:
  stockai-network:
    external: true
